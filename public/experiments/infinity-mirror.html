<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Mirror</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #nebula-wrapper { position: relative; width: 100%; height: 100vh; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="nebula-wrapper">
  <div id="nebula-overlay" style="position: absolute; inset: 0; background: radial-gradient(circle, #111 0%, #000 100%); display: flex; align-items: center; justify-content: center; z-index: 100;">
    <div style="text-align: center; color: white; font-family: sans-serif;">
      <h1 style="font-size: 2rem; font-weight: 100; letter-spacing: 0.2em; margin-bottom: 0.5rem; color: white;">INFINITY MIRROR</h1>
      <p style="font-size: 10px; letter-spacing: 0.4em; color: #06b6d4; margin-bottom: 0.5rem;">THREE.JS + HAND TRACKING</p>
      <p style="font-size: 11px; color: #aaa; margin-bottom: 2rem;">Move your hand to tilt the tunnel. Requires camera access.</p>
      <button id="nebula-start-btn" style="padding: 1rem 2.5rem; border: 1px solid rgba(6, 182, 212, 0.5); color: #22d3ee; background: rgba(8, 47, 55, 0.2); border-radius: 9999px; cursor: pointer; font-size: 12px; letter-spacing: 0.1em;">
        INITIALIZE
      </button>
    </div>
  </div>
  <video id="nebula-webcam" autoplay playsinline style="display: none;"></video>
  <div id="nebula-canvas-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

  let scene, camera, renderer, composer, mirrorGroup;
  let video, hands, cameraPipe;
  let targetRotation = { x: 0, y: 0 };
  const frames = [];
  const FRAME_COUNT = 60;
  const SPACING = 0.4;
  const wrapper = document.getElementById('nebula-wrapper');

  function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    document.getElementById('nebula-canvas-container').appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(wrapper.clientWidth, wrapper.clientHeight), 2.0, 0.4, 0.1);
    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    mirrorGroup = new THREE.Group();
    scene.add(mirrorGroup);

    const frameWidth = 6.0;
    const frameHeight = 10.0;
    for (let i = 0; i < FRAME_COUNT; i++) {
      const geometry = new THREE.PlaneGeometry(frameWidth, frameHeight);
      const edges = new THREE.EdgesGeometry(geometry);
      const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 - (i / FRAME_COUNT) });
      const line = new THREE.LineSegments(edges, material);
      line.position.z = -i * SPACING;
      const scale = Math.pow(0.98, i);
      line.scale.set(scale, scale, scale);
      mirrorGroup.add(line);
      frames.push(line);
    }

    wrapper.addEventListener('mousemove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      targetRotation.y = ((e.clientX - rect.left) / wrapper.clientWidth - 0.5) * 1.2;
      targetRotation.x = ((e.clientY - rect.top) / wrapper.clientHeight - 0.5) * 1.2;
    });

    wrapper.addEventListener('touchmove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const touch = e.touches[0];
      targetRotation.y = ((touch.clientX - rect.left) / wrapper.clientWidth - 0.5) * 1.2;
      targetRotation.x = ((touch.clientY - rect.top) / wrapper.clientHeight - 0.5) * 1.2;
    });
  }

  function onHandResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const hand = results.multiHandLandmarks[0];
      targetRotation.y = -(hand[9].x - 0.5) * 2.0;
      targetRotation.x = (hand[9].y - 0.5) * 2.0;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    mirrorGroup.rotation.x += (targetRotation.x - mirrorGroup.rotation.x) * 0.1;
    mirrorGroup.rotation.y += (targetRotation.y - mirrorGroup.rotation.y) * 0.1;
    const time = Date.now() * 0.005;
    frames.forEach((frame, i) => {
      const wave = Math.sin(time - (i * 0.4));
      if (wave > 0.7) {
        frame.material.color.setHex(0x00ffff);
        frame.material.opacity = 1.0;
      } else {
        frame.material.color.setHex(0x333333);
        frame.material.opacity = Math.max(0, (1 - (i / FRAME_COUNT)) * 0.5);
      }
    });
    composer.render();
  }

  function initMediaPipe() {
    video = document.getElementById('nebula-webcam');
    hands = new Hands({ locateFile: (file) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5 });
    hands.onResults(onHandResults);
    cameraPipe = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 480, height: 640
    });
  }

  document.getElementById('nebula-start-btn').addEventListener('click', function () {
    document.getElementById('nebula-overlay').style.display = 'none';
    initThree();
    initMediaPipe();
    cameraPipe.start();
    animate();
  });

  window.addEventListener('resize', () => {
    if (!camera) return;
    camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    composer.setSize(wrapper.clientWidth, wrapper.clientHeight);
  });
</script>
</body>
</html>
